<svg viewBox="0 0 700 410" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, 'SF Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="700" height="410" rx="14"/>
    </clipPath>
  </defs>

  <rect width="700" height="410" rx="14" fill="#1e1e2e"/>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="700" height="44" fill="#181825"/>
    <circle cx="24" cy="22" r="6" fill="#f38ba8"/>
    <circle cx="44" cy="22" r="6" fill="#f9e2af"/>
    <circle cx="64" cy="22" r="6" fill="#a6e3a1"/>
    <text x="350" y="27" text-anchor="middle" font-size="13" fill="#6c7086">app/api/chat/route.ts</text>

    <text x="28" y="72" font-size="11" font-weight="bold" letter-spacing="1" fill="#f38ba8">BEFORE</text>
    <text x="28" y="96" font-size="13.5" fill="#cdd6f4">const completion = await openai.chat.completions.create({</text>
    <text x="46" y="116" font-size="13.5" fill="#cdd6f4">model: "gpt-4o", messages</text>
    <text x="28" y="136" font-size="13.5" fill="#cdd6f4">}); <tspan fill="#6c7086">// OpenAI 429s -&gt; whole route is down</tspan></text>

    <line x1="28" y1="160" x2="672" y2="160" stroke="#313244" stroke-dasharray="4 4"/>

    <text x="28" y="188" font-size="11" font-weight="bold" letter-spacing="1" fill="#a6e3a1">AFTER</text>
    <text x="28" y="212" font-size="13.5" fill="#cdd6f4">import { fallback } from <tspan fill="#a6e3a1">"@enahoro/ai-fallback"</tspan>;</text>
    <text x="28" y="240" font-size="13.5" fill="#cdd6f4">const reply = await fallback([</text>
    <text x="46" y="260" font-size="13.5" fill="#cdd6f4">{ label: "openai", call: () =&gt; openai.chat(...) },</text>
    <text x="46" y="280" font-size="13.5" fill="#cdd6f4">{ label: "claude", call: () =&gt; anthropic.messages(...) },</text>
    <text x="28" y="300" font-size="13.5" fill="#cdd6f4">]); <tspan fill="#6c7086">// OpenAI 429s -&gt; Claude picks it up</tspan></text>

    <rect x="0" y="330" width="700" height="1" fill="#313244"/>
    <rect x="0" y="331" width="700" height="79" fill="#181825"/>
    <text x="28" y="366" font-size="13" fill="#a6adc8">Same SDKs. Same calls. One wrapper.</text>
    <text x="672" y="366" text-anchor="end" font-size="13" fill="#6c7086">npm i @enahoro/ai-fallback</text>
  </g>
</svg>
